name: Pebble Hybrid Verify

on:
  push:
    branches: [pebble-hybrid-final]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pebble-hybrid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify audited hybrid source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          shas = [
              'dcd36f33ddb214d59848d7bdd4c4108f78ed2220',
              '66d1463001e4b0e6c1ee1086f16242997a45f9dd',
              'a71c810f54cb5db84d50cf0678e096a31397d79c',
              '6bc25af90c05f9a2be58deba878b568855f11b3d',
              'c82c7bce6ee8103787ea35050445eda866612c0e',
              '422eeef41aa7626ada565be0a8260caf607d56c2',
              '2b36767e27398cd4d8e42c92b80b68f67298f198',
              '838e1ebf80386b02e569ece3518eb4cec98651d7',
              '2c3fb5886578512d926572798872aa9cac0606f7',
              '43f762d8f56c2fa345bb422ef25424525e2087fd',
              '35fdbc1f3957683b4c8ff688bc2863cba5c62599',
              '10dddbe753af6c94feafbadbf822b26114041cc6',
              '6d08b3e4224eba69a4bda7537e1fc9ded980cd1e',
          ]
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'pebble-hybrid-verify',
          }
          with open('/tmp/pebble-hybrid.patch', 'wb') as target:
              for sha in shas:
                  req = urllib.request.Request(
                      f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                      headers=headers,
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.load(response)
                  target.write(base64.b64decode(payload['content']))
          PY
          test "$(wc -c < /tmp/pebble-hybrid.patch)" -eq 92730
          echo "1e1c909b6390fb419c0726e65fecd42ee4750cfb3c1e0dd7fec44f75492d90c3  /tmp/pebble-hybrid.patch" | sha256sum -c -
          git apply --check /tmp/pebble-hybrid.patch
          git apply /tmp/pebble-hybrid.patch
          test -f src/core/PebbleDeterminism.js
          test -f src/world/VillageSystem.js
          test -f src/entities/VehicleEntity.js

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit imports
        run: npm run audit

      - name: Check JavaScript syntax
        run: find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Core regression suite
        run: npm run selftest

      - name: Phase 3 regression suite
        run: npm run selftest:phase3

      - name: Phase 4 regression suite
        run: npm run selftest:phase4

      - name: Phase 5 regression suite
        run: npm run selftest:phase5

      - name: Version 7 compatibility suite
        run: npm run selftest:v7

      - name: Version 8 compatibility suite
        run: npm run selftest:v8

      - name: Version 9 compatibility suite
        run: npm run selftest:v9

      - name: Pebble hybrid regression suite
        run: npm run selftest:hybrid

      - name: Production build
        run: npm run build

      - name: Static build smoke test
        run: npm run smoketest

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Browser/WebGL smoke test
        run: npm run smoketest:browser

      - name: Stage direct EdgeOne release
        run: |
          rm -rf release final.zip final.zip.sha256
          mkdir -p release/_source
          cp -a dist/. release/
          cp -a src scripts public .github release/_source/
          cp package.json package-lock.json index.html vite.config.js LICENSE README.md THIRD_PARTY_NOTICES.md PEBBLE-HYBRID.md release/_source/
          cp /tmp/pebble-hybrid.patch release/_source/pebble-hybrid.patch
          cp THIRD_PARTY_NOTICES.md PEBBLE-HYBRID.md release/
          printf '%s\n' 'Static root is deployable directly to EdgeOne Pages. Full patched source is in _source/.' > release/RELEASE-README.txt
          (cd release && zip -qr ../final.zip .)
          sha256sum final.zip > final.zip.sha256
          unzip -t final.zip

      - name: Upload verified final release
        uses: actions/upload-artifact@v4
        with:
          name: pebble-hybrid-final
          path: |
            final.zip
            final.zip.sha256
          if-no-files-found: error
          retention-days: 14
