name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit module graph
        run: npm run audit

      - name: Check JavaScript syntax
        run: find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Run deterministic regression suite
        run: npm run selftest

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run WebGL gameplay smoke test
        run: npm run smoketest:browser

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoketest-${{ github.run_id }}
          path: |
            dist-smoketest/**/*.png
            dist-smoketest/**/*.json
          if-no-files-found: ignore
          retention-days: 14
