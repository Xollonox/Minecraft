<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Voxel Sandbox</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="An original browser voxel sandbox engine built with Three.js." />
    <meta name="theme-color" content="#12161c" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  </head>
  <body>
    <!--
      The canvas and the boot screen are static so that something is visible
      before the JavaScript bundle has been parsed. Every other UI surface is
      created by the modules in `src/ui/`.
    -->
    <div id="app">
      <canvas id="game-canvas" aria-label="Voxel world viewport" role="img"></canvas>
      <div id="ui-root"></div>
    </div>

    <div id="boot-screen" class="boot-screen">
      <div class="boot-inner">
        <h1 class="boot-title">VOXEL<span>SANDBOX</span></h1>
        <div class="boot-bar"><div class="boot-bar-fill"></div></div>
        <p class="boot-status">Loading engine&hellip;</p>
      </div>
    </div>

    <noscript>
      <div class="fatal-error">
        <h1>JavaScript required</h1>
        <p>This voxel sandbox needs JavaScript and WebGL to run.</p>
      </div>
    </noscript>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
