<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="72" fill="#12161c"/>
  <!-- isometric grass-topped voxel cube, drawn from three parallelograms -->
  <g>
    <!-- top face -->
    <path d="M256 96 L432 192 L256 288 L80 192 Z" fill="#6cc24a"/>
    <path d="M256 96 L432 192 L256 288 L80 192 Z" fill="#8ada63" opacity="0.35"/>
    <!-- left face -->
    <path d="M80 192 L256 288 L256 416 L80 320 Z" fill="#7a5a3a"/>
    <!-- right face -->
    <path d="M432 192 L432 320 L256 416 L256 288 Z" fill="#5d4229"/>
    <!-- top rim highlight -->
    <path d="M256 96 L432 192 L256 288 L80 192 Z" fill="none" stroke="#a7e77f" stroke-width="6" stroke-linejoin="round" opacity="0.7"/>
  </g>
</svg>
